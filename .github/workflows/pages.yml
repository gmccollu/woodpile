# Pages: publish the project website (site/) with GitHub Pages.
#
# Publishes on every change to site/ on main (Pages enabled 2026-11-11, source: GitHub Actions),
# whenever a release is published, edited or deleted, once a day, and on demand.
#
# site/ is static (no build step). The download section reads releases.json, which this job
# writes from the releases API with its own token, into the artifact only (never committed):
# the page itself makes no requests to other sites, so shared corporate egress addresses
# can't run into the API's anonymous rate limit.
#
# Only the page files are uploaded, not the review screenshots or the test and tool folders.
#
# Uses only the official actions/* actions, pinned by commit SHA (version in the comment).
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  release:
    types: [published, edited, deleted]
  schedule:
    # Daily, so the list never drifts for long (for example after a release asset is replaced).
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read # enough to read releases
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check the site (download picking, the releases.json contract, contrast)
        working-directory: site
        run: |
          node --test test/download.test.mjs test/releases.test.mjs
          node tools/contrast.mjs

      - name: Stage the files to publish
        run: |
          mkdir -p _site
          cp site/*.html site/*.css site/*.js site/favicon.svg _site/
          cp -R site/img _site/img
          touch _site/.nojekyll

      - name: Write releases.json (latest stable and latest prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate --slurp "repos/$REPO/releases?per_page=100" > "$RUNNER_TEMP/releases-raw.json"
          node site/tools/releases.mjs < "$RUNNER_TEMP/releases-raw.json" > _site/releases.json
          node -e 'const r = require("./_site/releases.json");
            for (const k of ["stable", "prerelease"]) console.log(k + ":", r[k] ? r[k].tag_name + " (" + r[k].assets.length + " files)" : "none");'
          ls -lR _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
