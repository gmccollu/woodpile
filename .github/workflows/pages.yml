# Pages: publish the project website (site/) with GitHub Pages.
#
# Manual for now. Once the repo is public and Pages is enabled (Settings → Pages →
# Source: GitHub Actions), publish on every change to the site by adding to `on:`
#
#   push:
#     branches: [main]
#     paths: [site/**]
#
# site/ is static (no build step); only these files are uploaded, not the review
# screenshots or the test and tool folders.
#
# Uses only the official actions/* actions, pinned by commit SHA (version in the comment).
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check the site (download picking, contrast)
        working-directory: site
        run: |
          node --test test/download.test.mjs
          node tools/contrast.mjs

      - name: Stage the files to publish
        run: |
          mkdir -p _site
          cp site/*.html site/*.css site/*.js site/favicon.svg _site/
          cp -R site/img _site/img
          touch _site/.nojekyll
          ls -lR _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
