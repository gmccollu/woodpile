# Install smoke tests (SPEC §7): install every package for real on a fresh runner, check
# the service (account, ports, UI, 10,000 messages on disk), restart, upgrade, uninstall
# keeping the data and delete it on request; then the same with `woodshed install` (no
# package); then the rename: the last Woodpile release candidate's package, and this one
# installed over it (OLD_RELEASE below). The checks live in scripts/smoke/.
#
# macOS and Windows minutes are expensive, so this runs only:
#   - on a push to ci/install-smoke: the Linux jobs, plus Windows and macOS when the head
#     commit's message has [smoke all], [smoke windows] or [smoke macos];
#   - by hand (workflow_dispatch), choosing the OSes.
name: Install smoke

on:
  push:
    branches: ["ci/install-smoke"]
  workflow_dispatch:
    inputs:
      os:
        description: "Which OSes: all, linux, windows, macos or arm (the arm64 jobs)"
        default: all

permissions:
  contents: read

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  GORELEASER_VERSION: v2.20.1
  # The last release under the old name, Woodpile: the legacy steps install its packages
  # (downloaded from this repo's releases) and then this build's over them.
  OLD_RELEASE: v0.9.0-rc3
  NODE_VERSION: "24"
  WIX_VERSION: "5.0.2"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.p.outputs.windows }}
      macos: ${{ steps.p.outputs.macos }}
      portable_os: ${{ steps.p.outputs.portable_os }}
      arm_linux: ${{ steps.p.outputs.arm_linux }}
      arm_windows: ${{ steps.p.outputs.arm_windows }}
    steps:
      - id: p
        env:
          MSG: ${{ github.event.head_commit.message }}
          OS: ${{ inputs.os }}
          ARM_RUNNERS: ${{ vars.ARM_RUNNERS }}
        run: |
          w=false; m=false
          case "$OS" in all) w=true; m=true ;; windows) w=true ;; macos) m=true ;; esac
          case "$MSG" in *"[smoke all]"*) w=true; m=true ;; esac
          case "$MSG" in *"[smoke windows]"*) w=true ;; esac
          case "$MSG" in *"[smoke macos]"*) m=true ;; esac
          echo "windows=$w" >>"$GITHUB_OUTPUT"
          echo "macos=$m" >>"$GITHUB_OUTPUT"
          echo "windows=$w macos=$m"
          # arm64 (both labels available to this repo, checked 2026-11-11): Linux arm64 with the
          # Linux jobs; Windows on Arm with the Windows jobs, or with "[smoke arm]" / os=arm.
          # ARM_RUNNERS=false (a repo variable) turns them off, e.g. on a fork without the labels:
          # a job asking for a missing label waits forever.
          ask=false
          case "$OS" in arm) ask=true ;; esac
          case "$MSG" in *"[smoke arm]"*) ask=true ;; esac
          al=true; aw=$ask
          [ "$w" = true ] && aw=true
          if [ "$ARM_RUNNERS" = false ]; then al=false; aw=false; fi
          echo "arm_linux=$al" >>"$GITHUB_OUTPUT"
          echo "arm_windows=$aw" >>"$GITHUB_OUTPUT"
          echo "arm_linux=$al arm_windows=$aw"
          os='"ubuntu-latest"'
          [ "$w" = true ] && os="$os,\"windows-latest\""
          [ "$m" = true ] && os="$os,\"macos-latest\""
          echo "portable_os=[$os]" >>"$GITHUB_OUTPUT"

  linux-packages:
    name: build deb and rpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Snapshot build (the before hook builds the UI)
        env:
          WOODSHED_OWNER: ${{ github.repository_owner }}
          WOODSHED_REPO: ${{ github.event.repository.name }}
        run: go run github.com/goreleaser/goreleaser/v2@"$GORELEASER_VERSION" release --snapshot --clean --skip=publish
      - name: Collect
        run: |
          mkdir -p out
          cp dist/*_amd64.deb dist/*.x86_64.rpm out/
          cp "$(ls -d dist/woodshed_linux_amd64*/ | head -1)woodshed" out/woodshed
          go build -o out/verifyseq ./scripts/verifyseq
          ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: out/
          retention-days: 3
      # For the arm64 jobs: the arm64 deb, the release archives for Linux and Windows on arm64
      # (the portable downloads) and the test helpers built for arm64.
      - name: Collect arm64
        run: |
          mkdir -p out-arm64
          cp dist/*_arm64.deb dist/*_linux_arm64.tar.gz dist/*_windows_arm64.zip out-arm64/
          GOARCH=arm64 go build -o out-arm64/verifyseq ./scripts/verifyseq
          GOOS=windows GOARCH=arm64 go build -o out-arm64/verifyseq.exe ./scripts/verifyseq
          GOOS=windows GOARCH=arm64 go build -o out-arm64/consoleclose.exe ./scripts/smoke/consoleclose
          GOOS=windows GOARCH=arm64 go build -trimpath -o out-arm64/woodshed-aclfix.exe ./packaging/windows/aclfix
          # The upgrade test needs a second version (the snapshot's web/dist is embedded).
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "-X main.version=0.0.2" -o out-arm64/woodshed-0.0.2.exe ./cmd/woodshed
          ls -la out-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages-arm64
          path: out-arm64/
          retention-days: 3

  deb:
    name: deb on ubuntu (apt), then woodshed install
    needs: linux-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: dist
      - run: chmod +x dist/woodshed dist/verifyseq
      - name: deb (apt install, restart, remove, purge)
        env:
          VERIFYSEQ: dist/verifyseq
          SMOKE_LOGS: ${{ runner.temp }}/smoke-logs
        run: scripts/smoke/unix.sh deb dist/*_amd64.deb
      - name: woodshed install / uninstall (no package)
        env:
          VERIFYSEQ: dist/verifyseq
          SMOKE_LOGS: ${{ runner.temp }}/smoke-logs
        run: scripts/smoke/unix.sh manual dist/woodshed
      - name: Woodpile's deb, then this one over it
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFYSEQ: dist/verifyseq
          SMOKE_LOGS: ${{ runner.temp }}/smoke-logs
          WOODSHED_BIN: dist/woodshed
        run: |
          gh release download "$OLD_RELEASE" -R "$GITHUB_REPOSITORY" -p 'woodpile_*_amd64.deb' -D old
          scripts/smoke/unix.sh legacy old/woodpile_*_amd64.deb dist/*_amd64.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-deb
          path: ${{ runner.temp }}/smoke-logs

  rpm:
    name: rpm in a Fedora container with systemd
    needs: linux-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: dist
      - run: chmod +x dist/woodshed dist/verifyseq
      - name: Start Fedora with systemd as PID 1
        run: |
          cat >"$RUNNER_TEMP/Dockerfile" <<'EOF'
          FROM registry.fedoraproject.org/fedora:41
          RUN dnf -y install systemd procps-ng iproute python3 openssl curl findutils && dnf clean all
          CMD ["/usr/sbin/init"]
          EOF
          docker build -t woodshed-fedora-systemd "$RUNNER_TEMP"
          docker run -d --name fedora --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD":/src -w /src --tmpfs /run --tmpfs /tmp woodshed-fedora-systemd
          for i in $(seq 30); do
            state=$(docker exec fedora systemctl is-system-running 2>/dev/null || true)
            echo "systemd: $state"
            case "$state" in running|degraded) break ;; esac
            sleep 1
          done
          docker exec fedora test -d /run/systemd/system
      - name: rpm (dnf install, restart, remove)
        run: docker exec -e VERIFYSEQ=dist/verifyseq -e SMOKE_LOGS=/src/smoke-logs fedora scripts/smoke/unix.sh rpm "$(ls dist/*.x86_64.rpm)"
      - name: woodshed install / uninstall (no package)
        run: docker exec -e VERIFYSEQ=dist/verifyseq -e SMOKE_LOGS=/src/smoke-logs fedora scripts/smoke/unix.sh manual dist/woodshed
      - name: Woodpile's rpm, then this one over it (Obsoletes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$OLD_RELEASE" -R "$GITHUB_REPOSITORY" -p 'woodpile-*.x86_64.rpm' -D old
          docker exec -e VERIFYSEQ=dist/verifyseq -e SMOKE_LOGS=/src/smoke-logs -e WOODSHED_BIN=dist/woodshed fedora \
            bash -c 'scripts/smoke/unix.sh legacy old/woodpile-*.x86_64.rpm dist/*.x86_64.rpm'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-rpm
          path: smoke-logs

  windows:
    name: msi on windows, then woodshed install
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.0.x
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version $env:WIX_VERSION
      - name: Build v0.0.1 and v0.0.2 MSIs, the binary and verifyseq
        shell: pwsh
        run: |
          ./packaging/windows/build-msi.ps1 -Version 0.0.1 -Arch x64 -OutDir dist/v1
          ./packaging/windows/build-msi.ps1 -Version 0.0.2 -Arch x64 -OutDir dist/v2
          # For the legacy step: the same base version as Woodpile's last MSI (0.9.0-rc3 is
          # MSI version 0.9.0), so it needs AllowSameVersionUpgrades to replace it.
          ./packaging/windows/build-msi.ps1 -Version 0.9.0-rc9 -Arch x64 -OutDir dist/v3
          go build -o dist/woodshed.exe ./cmd/woodshed
          go build -o dist/verifyseq.exe ./scripts/verifyseq
          Get-ChildItem -Recurse dist
      - name: msi (install, upgrade, uninstall, DELETE_LOGS)
        shell: pwsh
        run: ./scripts/smoke/windows.ps1 -Mode msi -Msi (Resolve-Path dist/v1/*.msi) -UpgradeMsi (Resolve-Path dist/v2/*.msi) -Logs "$env:RUNNER_TEMP/smoke-logs"
      - name: woodshed install / uninstall (no package)
        shell: pwsh
        run: ./scripts/smoke/windows.ps1 -Mode manual -Binary dist/woodshed.exe -Logs "$env:RUNNER_TEMP/smoke-logs"
      - name: Woodpile's MSI, then this one over it (major upgrade)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:OLD_RELEASE -R $env:GITHUB_REPOSITORY -p 'woodpile_*_windows_amd64.msi' -D old
          if ($LASTEXITCODE -ne 0) { throw "gh release download exited $LASTEXITCODE" }
          ./scripts/smoke/windows.ps1 -Mode legacy -OldMsi (Resolve-Path old/*.msi) -Msi (Resolve-Path dist/v3/*.msi) -Binary dist/woodshed.exe -Logs "$env:RUNNER_TEMP/smoke-logs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-windows
          path: ${{ runner.temp }}/smoke-logs

  macos:
    name: pkg on macos, then woodshed install
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build the pkg, the binary and verifyseq
        run: |
          packaging/macos/build-pkg.sh --version 0.0.1 --out dist/macos
          go build -o dist/woodshed ./cmd/woodshed
          go build -o dist/verifyseq ./scripts/verifyseq
          ls -la dist dist/macos
      - name: pkg launcher app (/Applications/Woodshed.app)
        run: scripts/smoke/mac-launcher.sh dist/macos/*.pkg
      - name: pkg (installer, restart, uninstall.sh, --delete-logs)
        env:
          VERIFYSEQ: dist/verifyseq
          SMOKE_LOGS: ${{ runner.temp }}/smoke-logs
        run: scripts/smoke/unix.sh pkg dist/macos/*.pkg
      - name: woodshed install / uninstall (no package)
        env:
          VERIFYSEQ: dist/verifyseq
          SMOKE_LOGS: ${{ runner.temp }}/smoke-logs
        run: scripts/smoke/unix.sh manual dist/woodshed
      - name: Woodpile's pkg, then this one over it (preinstall removes the old daemon)
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFYSEQ: dist/verifyseq
          SMOKE_LOGS: ${{ runner.temp }}/smoke-logs
          WOODSHED_BIN: dist/woodshed
        run: |
          gh release download "$OLD_RELEASE" -R "$GITHUB_REPOSITORY" -p 'woodpile_*_macos_universal.pkg' -D old
          scripts/smoke/unix.sh legacy old/woodpile_*_macos_universal.pkg dist/macos/*.pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-macos
          path: ${{ runner.temp }}/smoke-logs

  # Portable mode: the downloaded binary, no install, on the real port 514.
  portable:
    name: portable mode on ${{ matrix.os }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.portable_os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build woodshed, verifyseq and consoleclose
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          go build -o dist/woodshed$ext ./cmd/woodshed
          go build -o dist/verifyseq$ext ./scripts/verifyseq
          go build -o dist/consoleclose$ext ./scripts/smoke/consoleclose
      - name: Portable mode (Linux, macOS)
        if: runner.os != 'Windows'
        env:
          VERIFYSEQ: dist/verifyseq
          SMOKE_LOGS: ${{ runner.temp }}/smoke-logs
        run: scripts/smoke/portable.sh dist/woodshed
      - name: Portable mode (Windows, closing the console window)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke/portable.ps1 -Logs "$env:RUNNER_TEMP/smoke-logs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-portable-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke-logs

  # arm64 (SPEC §6): the deb on Ubuntu arm64, then the Linux arm64 release tarball's own binary
  # (woodshed install, and portable mode); the arm64 MSI on Windows on Arm around the Windows
  # arm64 release zip's woodshed.exe, then the MSI hardening checks, woodshed install and
  # portable mode. Gated in `plan` (see arm_linux / arm_windows).
  deb-arm64:
    name: deb and tarball on ubuntu arm64
    needs: [plan, linux-packages]
    if: needs.plan.outputs.arm_linux == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages-arm64
          path: dist
      - name: Unpack the tarball
        run: |
          chmod +x dist/verifyseq
          tar -xzf dist/*_linux_arm64.tar.gz -C dist
          bin=$(ls dist/woodshed_*_linux_arm64/woodshed)
          ls -la "$(dirname "$bin")"
          file "$bin"
          "$bin" version
          echo "TARBALL_BIN=$bin" >>"$GITHUB_ENV"
      - name: deb (apt install, restart, remove, purge)
        env:
          VERIFYSEQ: dist/verifyseq
          SMOKE_LOGS: ${{ runner.temp }}/smoke-logs
        run: scripts/smoke/unix.sh deb dist/*_arm64.deb
      - name: the tarball's binary, woodshed install / uninstall
        env:
          VERIFYSEQ: dist/verifyseq
          SMOKE_LOGS: ${{ runner.temp }}/smoke-logs
        run: scripts/smoke/unix.sh manual "$TARBALL_BIN"
      - name: the tarball's binary, portable mode
        env:
          VERIFYSEQ: dist/verifyseq
          SMOKE_LOGS: ${{ runner.temp }}/smoke-logs
        run: scripts/smoke/portable.sh "$TARBALL_BIN"
      # Evidence for the unit's ProcSubset=pid question: what a hardened service can see of /proc.
      - name: procfs under the unit's sandbox (informational)
        run: |
          for subset in all pid; do
            echo "== ProcSubset=$subset"
            sudo systemd-run --quiet --wait --pipe -p DynamicUser=yes -p ProtectProc=invisible -p ProcSubset=$subset \
              sh -c 'for f in /proc/net/udp /proc/self/net/udp /proc/net/tcp; do if head -1 "$f" >/dev/null 2>&1; then echo "readable   $f"; else echo "unreadable $f"; fi; done' || true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-deb-arm64
          path: ${{ runner.temp }}/smoke-logs

  windows-arm64:
    name: msi (arm64) on windows on arm, then woodshed install and portable
    needs: [plan, linux-packages]
    if: needs.plan.outputs.arm_windows == 'true'
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages-arm64
          path: dist
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.0.x
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version $env:WIX_VERSION
      - name: Build v0.0.1 (the release zip's woodshed.exe) and v0.0.2 arm64 MSIs
        shell: pwsh
        run: |
          Expand-Archive (Resolve-Path dist/*_windows_arm64.zip) -DestinationPath dist/zip
          $exe = (Get-ChildItem dist/zip -Recurse -Filter woodshed.exe).FullName
          Get-ChildItem (Split-Path $exe)
          & $exe version
          ./packaging/windows/build-msi.ps1 -Version 0.0.1 -Arch arm64 -Binary $exe -AclFix dist/woodshed-aclfix.exe -OutDir dist/v0.0.1
          ./packaging/windows/build-msi.ps1 -Version 0.0.2 -Arch arm64 -Binary dist/woodshed-0.0.2.exe -AclFix dist/woodshed-aclfix.exe -OutDir dist/v0.0.2
          Copy-Item $exe dist/woodshed.exe
      - name: MSI hardening checks (ACL reset over a hostile folder, required privileges)
        shell: pwsh
        run: ./scripts/smoke/msi-hardening.ps1 -Msi (Resolve-Path dist/v0.0.1/*.msi).Path -Logs "$env:RUNNER_TEMP/smoke-logs"
      - name: msi (install, upgrade, uninstall, DELETE_LOGS)
        shell: pwsh
        run: ./scripts/smoke/windows.ps1 -Mode msi -Msi (Resolve-Path dist/v0.0.1/*.msi) -UpgradeMsi (Resolve-Path dist/v0.0.2/*.msi) -VerifySeq dist/verifyseq.exe -Logs "$env:RUNNER_TEMP/smoke-logs"
      - name: woodshed install / uninstall (no package)
        shell: pwsh
        run: ./scripts/smoke/windows.ps1 -Mode manual -Binary dist/woodshed.exe -VerifySeq dist/verifyseq.exe -Logs "$env:RUNNER_TEMP/smoke-logs"
      - name: portable mode (closing the console window)
        shell: pwsh
        run: ./scripts/smoke/portable.ps1 -Binary dist/woodshed.exe -VerifySeq dist/verifyseq.exe -ConsoleClose dist/consoleclose.exe -Logs "$env:RUNNER_TEMP/smoke-logs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-windows-arm64
          path: ${{ runner.temp }}/smoke-logs
