# Rotates the Woodpile daemon's own stdout/stderr log (not the syslog data,
# which Woodpile rotates itself). Installed as /etc/newsyslog.d/com.woodpile.daemon.conf.
#
# Safe to run as root: /Library/Logs/Woodpile is root-owned and only the log file belongs to
# _woodpile (prepare_log_dir in packaging/macos/scripts/common.sh), so the daemon can't swap
# in a symlink for newsyslog to follow. newsyslog renames the file to woodpile.log.0 and
# creates a new one owned by _woodpile.
#
# No compression (no Z or J flag): launchd holds the daemon's output open, so the daemon keeps
# writing to woodpile.log.0 until it next starts; compressing that file would delete it while
# it's still being written. N: there's no pid file to signal.
# logfilename                          [owner:group]        mode count size(KB) when flags
/Library/Logs/Woodpile/woodpile.log    _woodpile:_woodpile  640  7     10240    *    N
