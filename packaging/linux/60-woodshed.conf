# Installed by the woodshed package and removed when the package is removed.
# Woodshed asks for a 32 MiB UDP receive buffer so bursts of syslog traffic
# are not dropped by the kernel; Linux caps that request at rmem_max.
# To override, put a higher-numbered file in /etc/sysctl.d/ instead of editing
# this one (package upgrades replace it).
net.core.rmem_max = 33554432
