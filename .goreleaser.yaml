# GoReleaser (OSS, v2 schema) for Woodpile.
#
# Builds the binaries, archives, checksums, deb/rpm (nfpm), a Homebrew cask and a
# Scoop manifest. The Windows MSI and macOS .pkg are built by separate jobs in
# .github/workflows/release.yml (GoReleaser's MSI/pkg support is a paid feature).
#
# Everything that names the repo comes from these environment variables (the release
# workflow sets them from the repo it runs in), so a fork or move needs no edit here:
#   WOODPILE_OWNER     user or org that owns the repo        (default: gmccollu)
#   WOODPILE_REPO      repo name                             (default: woodpile)
#   GITHUB_SERVER_URL  set by Actions; https://github.com or a GitHub Enterprise Server URL
#   TAP_GITHUB_TOKEN   token that can push to OWNER/homebrew-tap and OWNER/scoop-bucket.
#                      While it is unset, the cask and the Scoop manifest are generated
#                      in dist/ but not uploaded.
#
# Local dry run: make snapshot  (= goreleaser release --snapshot --clean --skip=publish)
version: 2

project_name: woodpile

env:
  - WOODPILE_OWNER={{ envOrDefault "WOODPILE_OWNER" "gmccollu" }}
  - WOODPILE_REPO={{ envOrDefault "WOODPILE_REPO" "woodpile" }}
  - WOODPILE_SERVER={{ envOrDefault "GITHUB_SERVER_URL" "https://github.com" }}
  - TAP_GITHUB_TOKEN={{ envOrDefault "TAP_GITHUB_TOKEN" "" }}

before:
  hooks:
    # The UI is embedded by Go, so it has to be built first. Skipped until web/ has a package.json.
    # The release workflow builds web/dist in its own job (no secrets, npm ci --ignore-scripts) and sets
    # WOODPILE_WEB_PREBUILT=1, so no npm code runs where the release tokens are.
    - sh -c 'if [ -n "$WOODPILE_WEB_PREBUILT" ]; then test -f web/dist/index.html && echo "using the prebuilt web/dist"; elif [ -f web/package.json ]; then cd web && npm ci && npm run build; else echo "web/package.json not found; skipping the frontend build"; fi'

builds:
  - id: woodpile
    main: ./cmd/woodpile
    binary: woodpile
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }}
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The MSI's data-folder ACL reset (packaging/windows/aclfix), run by the MSI as a custom
  # action. Built here so the release's Windows binaries all come from one build; it isn't
  # archived or shipped on its own.
  - id: aclfix
    main: ./packaging/windows/aclfix
    binary: woodpile-aclfix
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos: [windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

universal_binaries:
  # One macOS binary for arm64 + x86_64; it replaces the per-arch darwin binaries.
  - id: woodpile-universal
    ids: [woodpile]
    replace: true
    mod_timestamp: "{{ .CommitTimestamp }}"

# The archives double as the portable downloads: unpack, double-click woodpile, and its
# data goes in woodpile-data next to it. Each one unpacks into a folder of its own.
archives:
  - id: woodpile
    ids: [woodpile, woodpile-universal]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "all" }}universal{{ else }}{{ .Arch }}{{ end }}
    wrap_in_directory: true
    files:
      - src: packaging/portable/README.txt
        strip_parent: true
      - LICENSE
      - THIRD_PARTY_NOTICES.txt

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  # A prerelease-style version (like -rc1) so CI's snapshot exercises the same naming;
  # no "+", which GitHub would also rename in asset names.
  version_template: "{{ incpatch .Version }}-snapshot.{{ .ShortCommit }}"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge "

nfpms:
  - id: woodpile
    ids: [woodpile]
    package_name: woodpile
    # The package version keeps nfpm's "~" for a prerelease (0.9.0~rc1 sorts before 0.9.0 in
    # dpkg and rpm), but the file name doesn't: GitHub renames "~" in uploaded asset names,
    # so checksums.txt wouldn't match. woodpile_0.9.0-rc1_amd64.deb, woodpile-0.9.0-rc1-1.x86_64.rpm.
    file_name_template: '{{ replace .ConventionalFileName "~" "-" }}'
    formats: [deb, rpm]
    vendor: Woodpile
    homepage: "{{ .Env.WOODPILE_SERVER }}/{{ .Env.WOODPILE_OWNER }}/{{ .Env.WOODPILE_REPO }}"
    maintainer: "{{ .Env.WOODPILE_OWNER }} <{{ .Env.WOODPILE_OWNER }}@users.noreply.github.com>"
    description: |-
      Simple, reliable syslog server with a web UI.
      Receives syslog on UDP and TCP port 514, stores every message as plain files
      per device per day within a disk budget, and serves a local web UI on
      http://127.0.0.1:8514/ for live tail, search and export.
    license: MIT
    section: net
    priority: optional
    bindir: /usr/bin
    contents:
      - src: packaging/linux/woodpile.service
        dst: /usr/lib/systemd/system/woodpile.service
        file_info:
          mode: 0644
      # A plain package file (not a conffile), so dpkg and rpm both delete it on
      # removal and replace it on upgrade. Admins override it with a higher-numbered drop-in.
      - src: packaging/linux/60-woodpile.conf
        dst: /etc/sysctl.d/60-woodpile.conf
        file_info:
          mode: 0644
      # A desktop entry that opens the web UI, and its icon (harmless on a headless server).
      - src: packaging/linux/woodpile.desktop
        dst: /usr/share/applications/woodpile.desktop
        file_info:
          mode: 0644
      - src: web/public/favicon.svg
        dst: /usr/share/icons/hicolor/scalable/apps/woodpile.svg
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/woodpile/LICENSE
        file_info:
          mode: 0644
      - src: THIRD_PARTY_NOTICES.txt
        dst: /usr/share/doc/woodpile/THIRD_PARTY_NOTICES.txt
        file_info:
          mode: 0644
      - src: docs/install.md
        dst: /usr/share/doc/woodpile/install.md
        file_info:
          mode: 0644
    scripts:
      postinstall: packaging/linux/scripts/postinstall.sh
      preremove: packaging/linux/scripts/preremove.sh
      postremove: packaging/linux/scripts/postremove.sh
    overrides:
      deb:
        dependencies: [passwd]
      rpm:
        dependencies: [shadow-utils]

homebrew_casks:
  - name: woodpile
    ids: [woodpile]
    repository:
      owner: "{{ .Env.WOODPILE_OWNER }}"
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "{{ .Env.WOODPILE_SERVER }}/{{ .Env.WOODPILE_OWNER }}/{{ .Env.WOODPILE_REPO }}"
    description: Simple, reliable syslog server with a web UI
    license: MIT
    # Not uploaded until the tap exists and TAP_GITHUB_TOKEN is set.
    skip_upload: '{{ if .Env.TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'
    caveats: |-
      This installs the woodpile command only. To run it as a system service, use the
      .pkg installer from the releases page, or run it in the foreground:
        woodpile run
      The binary is not signed yet; see docs/install.md for the Gatekeeper prompt.

scoops:
  - name: woodpile
    ids: [woodpile]
    repository:
      owner: "{{ .Env.WOODPILE_OWNER }}"
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "{{ .Env.WOODPILE_SERVER }}/{{ .Env.WOODPILE_OWNER }}/{{ .Env.WOODPILE_REPO }}"
    description: Simple, reliable syslog server with a web UI
    license: MIT
    # Not uploaded until the bucket exists and TAP_GITHUB_TOKEN is set.
    skip_upload: '{{ if .Env.TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'

# Empty on github.com (GoReleaser's defaults). On GitHub Enterprise Server, Actions sets
# GITHUB_SERVER_URL and these point GoReleaser at that server's API.
github_urls:
  api: '{{ if ne .Env.WOODPILE_SERVER "https://github.com" }}{{ .Env.WOODPILE_SERVER }}/api/v3/{{ end }}'
  upload: '{{ if ne .Env.WOODPILE_SERVER "https://github.com" }}{{ .Env.WOODPILE_SERVER }}/api/uploads/{{ end }}'
  download: "{{ .Env.WOODPILE_SERVER }}"

release:
  # Named from the env vars above, not the git remote (there may be none locally).
  github:
    owner: "{{ .Env.WOODPILE_OWNER }}"
    name: "{{ .Env.WOODPILE_REPO }}"
  # Created as a draft: the release workflow attaches the MSIs and the pkg, adds them to
  # checksums.txt and only then publishes it, so nobody sees a half-filled release (and it
  # works with GitHub's immutable releases, which forbid adding assets after publishing).
  draft: true
  replace_existing_draft: true
  # Tags with a prerelease part (v0.9.0-rc1) become GitHub prereleases.
  prerelease: auto
  # The body comes from CHANGELOG.md (--release-notes); this goes under it.
  footer: |-
    ---
    **Downloads:** the MSI (Windows), `.pkg` (macOS), `.deb` / `.rpm` (Linux) install Woodpile as a service.
    The `.zip` / `.tar.gz` archives are the portable version: unpack, double-click `woodpile`, and its data
    goes in `woodpile-data` next to it. Verify downloads against `checksums.txt`.
    The installers aren't signed yet, so expect a SmartScreen or Gatekeeper prompt the first time; see the
    [user guide]({{ .Env.WOODPILE_SERVER }}/{{ .Env.WOODPILE_OWNER }}/{{ .Env.WOODPILE_REPO }}/blob/{{ .Tag }}/docs/user-guide.md).
